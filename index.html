<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniRaster | Universal Raster Graphics Converter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">⚡ OmniRaster</div>
    <nav>
      <a href="#converter">Converter</a>
      <a href="#formats">Supported Formats</a>
    </nav>
  </header>

  <main>
    <section id="converter" class="hero">
      <h1>Universal In-Browser Raster Graphics Converter</h1>
      <p>Convert any bitmap or raster graphic format directly in your browser with zero server uploads.</p>

      <div class="converter-box">
        <div id="drop-zone" class="drop-zone">
          <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <p>Drag & drop any raster image here or <label for="file-input" class="browse-link">browse</label></p>
          <input type="file" id="file-input" style="display: none;">
        </div>

        <div class="controls">
          <div class="field">
            <label for="target-format">Target Format:</label>
            <select id="target-format"></select>
          </div>
          <button id="convert-btn" disabled>Convert Image</button>
          <button id="download-btn" style="display: none;" class="btn-success">Download Converted</button>
        </div>

        <div id="status-text" class="status">Awaiting file...</div>

        <div class="preview-wrapper">
          <canvas id="preview-canvas"></canvas>
        </div>
      </div>
    </section>

    <section id="formats" class="catalog-section">
      <div class="catalog-header">
        <h2>Supported Formats Directory</h2>
        <input type="text" id="search-formats" placeholder="Filter formats by name or extension (e.g. QOI, DDS, NEF)...">
      </div>
      <div id="format-list" class="format-grid"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
